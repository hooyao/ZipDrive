name: Release

on:
  push:
    tags: ['release-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. release-1.0.10)'
        required: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve the version once; share it with the build matrix + release job.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      prerelease: ${{ steps.version.outputs.PRERELEASE }}
    steps:
      - name: Parse version from tag
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag -replace '^release-', ''
          Write-Output "VERSION=$version" >> $env:GITHUB_OUTPUT
          if ($version -match '-') {
            Write-Output "PRERELEASE=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "PRERELEASE=false" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Version: $version, Prerelease: $($version -match '-')"

  # ---------------------------------------------------------------------------
  # 2. Test gate (one Windows runner) before producing any release binary.
  # ---------------------------------------------------------------------------
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ZipDrive.slnx

      - name: Build
        run: dotnet build ZipDrive.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $projects = @(
            "tests/ZipDrive.Domain.Tests/ZipDrive.Domain.Tests.csproj",
            "tests/ZipDrive.Infrastructure.FileSystem.Tests/ZipDrive.Infrastructure.FileSystem.Tests.csproj",
            "tests/ZipDrive.Infrastructure.Caching.Tests/ZipDrive.Infrastructure.Caching.Tests.csproj",
            "tests/ZipDrive.Infrastructure.Archives.Zip.Tests/ZipDrive.Infrastructure.Archives.Zip.Tests.csproj",
            "tests/ZipDrive.Infrastructure.Archives.Rar.Tests/ZipDrive.Infrastructure.Archives.Rar.Tests.csproj",
            "tests/ZipDrive.IntegrationTests/ZipDrive.IntegrationTests.csproj"
          )
          $failed = $false
          foreach ($proj in $projects) {
            dotnet test $proj -c Release --no-build --verbosity normal
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

  # ---------------------------------------------------------------------------
  # 3. Build the Native AOT binary per RID on its own runner (AOT cannot
  #    cross-compile: win-x64 on windows-latest, win-arm64 natively on
  #    windows-11-arm). CI images ship the MSVC toolchain to the SDK's AOT
  #    targets directly, so a bare `dotnet publish -r <rid>` drives the link —
  #    no vcvars/vswhere dance (that is only needed by build-aot.bat on dev boxes).
  # ---------------------------------------------------------------------------
  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish AOT (${{ matrix.rid }})
        run: >
          dotnet publish src/ZipDrive.Cli/ZipDrive.Cli.csproj
          -c Release -r ${{ matrix.rid }}
          "-p:Version=${{ needs.version.outputs.version }}"
          -o ./publish-aot

      - name: Smoke test (boots under AOT)
        shell: pwsh
        run: |
          # Point at a path that does not exist: the host validates it and exits
          # cleanly BEFORE touching WinFsp (not installed on the runner). Proves
          # the native binary loads and runs main on the real OS/arch.
          $out = '' | & ./publish-aot/ZipDrive.exe --Mount:ArchiveDirectory="Z:\__nonexistent_zipdrive__" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'ZipDrive .* starting') { throw "AOT binary did not boot (startup banner missing)" }

      - name: Package (Windows zip)
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $exe = Get-Item ./publish-aot/ZipDrive.exe
          $sizeMB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Packaging ZipDrive.exe ($sizeMB MB) + appsettings.jsonc into ZipDrive-$version-$rid.zip"
          Compress-Archive `
            -Path ./publish-aot/ZipDrive.exe, ./publish-aot/appsettings.jsonc `
            -DestinationPath "ZipDrive-$version-$rid.zip" `
            -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.rid }}
          path: ZipDrive-*.zip
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 4. Collect every arm's archive and publish ONE GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout (it only downloads artifacts), so `gh` can't
          # infer the repo from a local .git. Point it at the repo explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          prerelease="${{ needs.version.outputs.prerelease }}"
          args=(release create "v$version"
            --title "ZipDrive $version"
            --generate-notes)
          if [ "$prerelease" = "true" ]; then
            args+=(--prerelease)
          fi
          for f in dist/*; do
            args+=("$f")
          done
          gh "${args[@]}"
