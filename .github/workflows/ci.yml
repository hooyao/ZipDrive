name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '*.slnx'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.github/workflows/ci.yml'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ZipDrive.slnx

      - name: Build
        run: dotnet build ZipDrive.slnx -c Release --no-restore

      - name: Test
        run: |
          $projects = @(
            "tests/ZipDrive.Domain.Tests/ZipDrive.Domain.Tests.csproj",
            "tests/ZipDrive.Infrastructure.Caching.Tests/ZipDrive.Infrastructure.Caching.Tests.csproj",
            "tests/ZipDrive.Infrastructure.Archives.Zip.Tests/ZipDrive.Infrastructure.Archives.Zip.Tests.csproj",
            "tests/ZipDrive.IntegrationTests/ZipDrive.IntegrationTests.csproj"
          )
          $failed = $false
          foreach ($proj in $projects) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($proj)
            dotnet test $proj -c Release --no-build --verbosity normal `
              --logger "trx;LogFileName=$name.trx" `
              --results-directory ./TestResults `
              --collect:"XPlat Code Coverage"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
        shell: pwsh

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true
          use-actions-summary: 'true'
          only-summary: 'false'
          list-suites: all
          list-tests: failed

      - name: Post test and coverage summary
        if: always()
        shell: pwsh
        run: |
          $nsUri = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"
          $totalPassed = 0; $totalFailed = 0; $totalSkipped = 0
          $lines = @("## Test Results", "", "| Suite | Passed | Failed | Skipped | Total |", "|-------|-------:|-------:|--------:|------:|")

          foreach ($file in Get-ChildItem ./TestResults -Filter *.trx) {
            $doc = New-Object System.Xml.XmlDocument
            $doc.Load($file.FullName)
            $mgr = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
            $mgr.AddNamespace("t", $nsUri)
            $counters = $doc.SelectSingleNode("//t:Counters", $mgr)
            $p = [int]$counters.GetAttribute("passed")
            $f = [int]$counters.GetAttribute("failed")
            $t = [int]$counters.GetAttribute("total")
            $s = $t - $p - $f
            $totalPassed += $p; $totalFailed += $f; $totalSkipped += $s
            $name = $file.BaseName -replace '\.Tests$','' -replace 'ZipDrive\.',''
            $icon = if ($f -gt 0) { ":x:" } else { ":white_check_mark:" }
            $lines += "| $icon $name | $p | $f | $s | $t |"
          }

          $grand = $totalPassed + $totalFailed + $totalSkipped
          $lines += "| **Total** | **$totalPassed** | **$totalFailed** | **$totalSkipped** | **$grand** |"
          $lines += ""

          # Coverage
          dotnet tool install -g dotnet-reportgenerator-globaltool --verbosity quiet 2>$null
          reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:TestResults/CoverageReport" "-reporttypes:MarkdownSummaryGithub" 2>$null
          if (Test-Path TestResults/CoverageReport/SummaryGithub.md) {
            $lines += (Get-Content TestResults/CoverageReport/SummaryGithub.md)
          }

          # Write to file for reuse, then append to GITHUB_STEP_SUMMARY
          $lines | Out-File -FilePath TestResults/summary.md -Encoding utf8
          Get-Content TestResults/summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-report
          path: TestResults/summary.md

  # Native AOT build per RID on its own runner (AOT cannot cross-compile).
  # Verifies the publish is trim/AOT-clean and uploads a downloadable
  # ZipDrive.exe artifact for both architectures. CI images expose the MSVC
  # toolchain to the SDK's AOT targets, so a bare `dotnet publish -r <rid>`
  # links natively — no vcvars/vswhere dance (that's only for build-aot.bat
  # on dev machines).
  aot-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish AOT (${{ matrix.rid }})
        run: >
          dotnet publish src/ZipDrive.Cli/ZipDrive.Cli.csproj
          -c Release -r ${{ matrix.rid }} -o ./publish-aot

      - name: Smoke test (boots under AOT)
        shell: pwsh
        run: |
          # Nonexistent path: the host validates and exits cleanly BEFORE touching
          # WinFsp (not installed on the runner). Proves the native binary boots.
          $out = '' | & ./publish-aot/ZipDrive.exe --Mount:ArchiveDirectory="Z:\__nonexistent_zipdrive__" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'ZipDrive .* starting') { throw "AOT binary did not boot (startup banner missing)" }

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = Get-Item ./publish-aot/ZipDrive.exe
          $sizeMB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "${{ matrix.rid }}: ZipDrive.exe = $sizeMB MB ($($exe.Length) bytes)"
          "| ``${{ matrix.rid }}`` | $sizeMB MB |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload AOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZipDrive-${{ matrix.rid }}
          path: |
            publish-aot/ZipDrive.exe
            publish-aot/appsettings.jsonc
          if-no-files-found: error
